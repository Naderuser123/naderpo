<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تقویم شمسی - نادر اکشیک</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&family=Lalezar&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1a5f7a;
            --primary-light: #57c5b6;
            --secondary: #d4a373;
            --accent: #e9c46a;
            --bg-dark: #0f1419;
            --bg-card: #1a1f26;
            --bg-hover: #252d38;
            --text-primary: #f8f9fa;
            --text-secondary: #8b949e;
            --holiday: #ff6b6b;
            --friday: #ffd93d;
            --nowruz: #2ecc71;
            --religious: #9b59b6;
            --national: #3498db;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Vazirmatn', sans-serif;
            background: var(--bg-dark);
            min-height: 100vh;
            color: var(--text-primary);
            overflow-x: hidden;
        }

        /* Background Pattern */
        .bg-pattern {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            opacity: 0.03;
            background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='1'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
            z-index: 0;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
            position: relative;
            z-index: 1;
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 3rem;
            animation: fadeInDown 0.8s ease-out;
        }

        .designer-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            padding: 0.5rem 1.5rem;
            border-radius: 50px;
            font-size: 0.85rem;
            margin-bottom: 1.5rem;
            box-shadow: 0 4px 20px rgba(26, 95, 122, 0.3);
        }

        .designer-badge svg {
            width: 18px;
            height: 18px;
        }

        .main-title {
            font-family: 'Lalezar', cursive;
            font-size: clamp(2.5rem, 8vw, 4rem);
            background: linear-gradient(135deg, var(--accent), var(--secondary), var(--primary-light));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.5rem;
            letter-spacing: 0.05em;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 1.1rem;
            font-weight: 300;
        }

        /* Navigation */
        .nav-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            gap: 1rem;
            animation: fadeInUp 0.6s ease-out 0.2s both;
        }

        .month-nav {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .nav-btn {
            background: var(--bg-card);
            border: 1px solid rgba(255,255,255,0.1);
            color: var(--text-primary);
            width: 48px;
            height: 48px;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .nav-btn:hover {
            background: var(--bg-hover);
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .nav-btn svg {
            width: 24px;
            height: 24px;
        }

        .current-month {
            font-family: 'Lalezar', cursive;
            font-size: 1.8rem;
            color: var(--text-primary);
            min-width: 200px;
            text-align: center;
        }

        .today-btn {
            background: linear-gradient(135deg, var(--secondary), var(--accent));
            border: none;
            color: var(--bg-dark);
            padding: 0.75rem 1.5rem;
            border-radius: 12px;
            font-family: 'Vazirmatn', sans-serif;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .today-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(212, 163, 115, 0.4);
        }

        /* Calendar Grid */
        .calendar-wrapper {
            background: var(--bg-card);
            border-radius: 24px;
            padding: 1.5rem;
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.05);
            animation: fadeInUp 0.8s ease-out 0.4s both;
        }

        .weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .weekday {
            text-align: center;
            padding: 1rem 0.5rem;
            font-weight: 600;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .weekday.friday {
            color: var(--friday);
        }

        .days-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 0.5rem;
        }

        .day {
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            background: transparent;
            border: 1px solid transparent;
        }

        .day:hover:not(.empty):not(.other-month) {
            background: var(--bg-hover);
            transform: scale(1.05);
        }

        .day-number {
            font-size: 1.2rem;
            font-weight: 500;
            z-index: 1;
        }

        .day-name {
            font-size: 0.65rem;
            color: var(--text-secondary);
            margin-top: 0.25rem;
            z-index: 1;
        }

        .day.other-month {
            opacity: 0.3;
        }

        .day.today {
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            box-shadow: 0 4px 20px rgba(26, 95, 122, 0.4);
        }

        .day.today .day-number {
            font-weight: 700;
        }

        .day.friday .day-number {
            color: var(--friday);
        }

        .day.friday .day-name {
            color: var(--friday);
        }

        .day.holiday {
            background: linear-gradient(135deg, rgba(255,107,107,0.2), rgba(255,107,107,0.1));
            border-color: rgba(255,107,107,0.3);
        }

        .day.holiday .day-number {
            color: var(--holiday);
            font-weight: 600;
        }

        .day.nowruz {
            background: linear-gradient(135deg, rgba(46,204,113,0.2), rgba(46,204,113,0.1));
            border-color: rgba(46,204,113,0.3);
        }

        .day.nowruz .day-number {
            color: var(--nowruz);
            font-weight: 700;
        }

        .day.religious {
            background: linear-gradient(135deg, rgba(155,89,182,0.2), rgba(155,89,182,0.1));
            border-color: rgba(155,89,182,0.3);
        }

        .day.religious .day-number {
            color: var(--religious);
        }

        .day.national {
            background: linear-gradient(135deg, rgba(52,152,219,0.2), rgba(52,152,219,0.1));
            border-color: rgba(52,152,219,0.3);
        }

        .day.national .day-number {
            color: var(--national);
        }

        /* Holiday Indicator Dot */
        .holiday-dot {
            position: absolute;
            bottom: 6px;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--holiday);
        }

        .day.nowruz .holiday-dot {
            background: var(--nowruz);
        }

        .day.religious .holiday-dot {
            background: var(--religious);
        }

        .day.national .holiday-dot {
            background: var(--national);
        }

        /* Event Modal */
        .event-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(10px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .event-modal.active {
            display: flex;
            opacity: 1;
        }

        .modal-content {
            background: var(--bg-card);
            border-radius: 24px;
            padding: 2rem;
            max-width: 400px;
            width: 90%;
            transform: scale(0.9) translateY(20px);
            transition: transform 0.3s ease;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .event-modal.active .modal-content {
            transform: scale(1) translateY(0);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 1.5rem;
        }

        .modal-date {
            font-family: 'Lalezar', cursive;
            font-size: 1.5rem;
            color: var(--accent);
        }

        .modal-day {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .close-btn {
            background: var(--bg-hover);
            border: none;
            color: var(--text-primary);
            width: 36px;
            height: 36px;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .close-btn:hover {
            background: var(--holiday);
        }

        .event-list {
            list-style: none;
        }

        .event-item {
            padding: 1rem;
            background: var(--bg-hover);
            border-radius: 12px;
            margin-bottom: 0.75rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            animation: slideInRight 0.3s ease-out;
        }

        .event-icon {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .event-icon.holiday {
            background: linear-gradient(135deg, var(--holiday), #ff8787);
        }

        .event-icon.nowruz {
            background: linear-gradient(135deg, var(--nowruz), #27ae60);
        }

        .event-icon.religious {
            background: linear-gradient(135deg, var(--religious), #a569bd);
        }

        .event-icon.national {
            background: linear-gradient(135deg, var(--national), #5dade2);
        }

        .event-icon svg {
            width: 20px;
            height: 20px;
            color: white;
        }

        .event-text {
            flex: 1;
        }

        .event-title {
            font-weight: 600;
            margin-bottom: 0.25rem;
        }

        .event-desc {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        /* Legend */
        .legend {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            justify-content: center;
            margin-top: 2rem;
            padding: 1.5rem;
            background: var(--bg-card);
            border-radius: 16px;
            animation: fadeInUp 0.8s ease-out 0.6s both;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .legend-dot {
            width: 12px;
            height: 12px;
            border-radius: 4px;
        }

        .legend-dot.holiday { background: var(--holiday); }
        .legend-dot.nowruz { background: var(--nowruz); }
        .legend-dot.religious { background: var(--religious); }
        .legend-dot.national { background: var(--national); }
        .legend-dot.friday { background: var(--friday); }

        /* Animations */
        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideInRight {
            from {
                opacity: 0;
                transform: translateX(20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .container {
                padding: 1rem;
            }

            .calendar-wrapper {
                padding: 1rem;
            }

            .day {
                border-radius: 10px;
            }

            .day-number {
                font-size: 1rem;
            }

            .day-name {
                display: none;
            }

            .current-month {
                font-size: 1.3rem;
                min-width: 150px;
            }

            .legend {
                gap: 0.75rem;
            }
        }

        /* Persian number styling */
        .persian-num {
            font-feature-settings: "ss01";
        }
    </style>
</head>
<body>
    <div class="bg-pattern"></div>
    
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="designer-badge">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
                </svg>
                طراحی شده توسط نادر اکشیک
            </div>
            <h1 class="main-title">تقویم شمسی</h1>
            <p class="subtitle">تقویم رسمی ایران با تمام مناسبت‌ها</p>
        </header>

        <!-- Navigation -->
        <nav class="nav-section">
            <div class="month-nav">
                <button class="nav-btn" id="prevMonth">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="9 18 15 12 9 6"></polyline>
                    </svg>
                </button>
                <span class="current-month" id="currentMonth"></span>
                <button class="nav-btn" id="nextMonth">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="15 18 9 12 15 6"></polyline>
                    </svg>
                </button>
            </div>
            <button class="today-btn" id="todayBtn">امروز</button>
        </nav>

        <!-- Calendar -->
        <div class="calendar-wrapper">
            <div class="weekdays" id="weekdays"></div>
            <div class="days-grid" id="daysGrid"></div>
        </div>

        <!-- Legend -->
        <div class="legend">
            <div class="legend-item">
                <div class="legend-dot holiday"></div>
                تعطیل رسمی
            </div>
            <div class="legend-item">
                <div class="legend-dot friday"></div>
                جمعه
            </div>
            <div class="legend-item">
                <div class="legend-dot nowruz"></div>
                نوروز و جشن‌ها
            </div>
            <div class="legend-item">
                <div class="legend-dot religious"></div>
                اعیاد مذهبی
            </div>
            <div class="legend-item">
                <div class="legend-dot national"></div>
                مناسبت ملی
            </div>
        </div>
    </div>

    <!-- Event Modal -->
    <div class="event-modal" id="eventModal">
        <div class="modal-content">
            <div class="modal-header">
                <div>
                    <div class="modal-date" id="modalDate"></div>
                    <div class="modal-day" id="modalDay"></div>
                </div>
                <button class="close-btn" id="closeModal">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>
            <ul class="event-list" id="eventList"></ul>
        </div>
    </div>

    <script>
        // Persian/Jalali Calendar Utility
        class JalaliCalendar {
            static persianDays = ['یکشنبه', 'دوشنبه', 'سه‌شنبه', 'چهارشنبه', 'پنج‌شنبه', 'جمعه', 'شنبه'];
            static persianMonths = [
                'فروردین', 'اردیبهشت', 'خرداد', 'تیر', 'مرداد', 'شهریور',
                'مهر', 'آبان', 'آذر', 'دی', 'بهمن', 'اسفند'
            ];

            static gregorianDays = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

            static toJalali(gy, gm, gd) {
                const g_d_m = [0, 31, 59, 90, 120, 151, 181, 212, 243, 273, 304, 334];
                let jy = (gy <= 1600) ? 0 : 979;
                gy -= (gy <= 1600) ? 621 : 1600;
                const gy2 = (gm > 2) ? (gy + 1) : gy;
                let days = (365 * gy) + (Math.floor((gy2 + 3) / 4)) - (Math.floor((gy2 + 99) / 100)) 
                    + (Math.floor((gy2 + 399) / 400)) - 80 + gd + g_d_m[gm - 1];
                jy += 33 * (Math.floor(days / 12053));
                days %= 12053;
                jy += 4 * (Math.floor(days / 1461));
                days %= 1461;
                jy += Math.floor((days - 1) / 365);
                if (days > 365) days = (days - 1) % 365;
                const jm = (days < 186) ? 1 + Math.floor(days / 31) : 7 + Math.floor((days - 186) / 30);
                const jd = 1 + ((days < 186) ? (days % 31) : ((days - 186) % 30));
                return [jy, jm, jd];
            }

            static toGregorian(jy, jm, jd) {
                let jy_new = jy + 1595;
                const days = -1 + 365 * jy_new + (Math.floor(jy_new / 33)) * 8 
                    + (Math.floor((jy_new % 33 + 3) / 4)) + jd + (jm < 7) ? (jm - 1) * 31 : ((jm - 7) * 30) + 186;
                let gy = 400 * (Math.floor(days / 146097));
                let d = days - 146097 * (gy / 400);
                gy += 100 * (Math.floor(d / 36524));
                d -= 36524 * (gy / 100);
                gy += 4 * (Math.floor(d / 1461));
                d -= 1461 * (Math.floor(d / 1461));
                gy += Math.floor((d - 1) / 365);
                if (d > 365) d = (d - 1) % 365;
                const gd = d + 1;
                const sal_a = [0, 31, (gy % 4 === 0 && gy % 100 !== 0) || (gy % 400 === 0) ? 29 : 28, 
                    31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
                let gm = 0;
                let v = gd;
                for (gm = 0; gm < 13 && v > sal_a[gm]; gm++) v -= sal_a[gm];
                return [gy, gm, gd];
            }

            static getDaysInMonth(jy, jm) {
                if (jm <= 6) return 31;
                if (jm <= 11) return 30;
                return this.isLeapYear(jy) ? 30 : 29;
            }

            static isLeapYear(jy) {
                return ((11 * jy + 14) % 30) < 11;
            }

            static getDayOfWeek(jy, jm, jd) {
                const [gy, gm, gd] = this.toGregorian(jy, jm, jd);
                const [jy2, jm2, jd2] = this.toJalali(gy, gm, gd);
                const g_dow = new Date(gy, gm - 1, gd).getDay();
                return g_dow;
            }
        }

        // Persian Events Database
        const persianEvents = {
            // Farvardin (فروردین) - Month 1
            '1-1': { type: 'nowruz', title: 'نوروز', desc: 'آغاز سال نو شمسی' },
            '1-2': { type: 'nowruz', title: 'عید نوروز', desc: 'دومین روز نوروز' },
            '1-3': { type: 'nowruz', title: 'سومین روز نوروز', desc: 'سوم فروردین' },
            '1-4': { type: 'nowruz', title: 'چهارمین روز نوروز', desc: 'چهارم فروردین' },
            '1-5': { type: 'holiday', title: 'پنجمین روز نوروز', desc: 'پنجم فروردین' },
            '1-6': { type: 'nowruz', title: 'ششمین روز نوروز', desc: 'ششم فروردین' },
            '1-7': { type: 'nowruz', title: 'هفتمین روز نوروز', desc: 'هفتم فروردین' },
            '1-8': { type: 'nowruz', title: 'هشتمین روز نوروز', desc: 'هشتم فروردین' },
            '1-9': { type: 'nowruz', title: 'نهمین روز نوروز', desc: 'نهم فروردین' },
            '1-10': { type: 'nowruz', title: 'دهمین روز نوروز', desc: 'دهم فروردین' },
            '1-11': { type: 'nowruz', title: 'یازدهمین روز نوروز', desc: 'یازدهم فروردین' },
            '1-12': { type: 'nowruz', title: 'دوازدهمین روز نوروز', desc: 'دوازدهم فروردین' },
            '1-13': { type: 'nowruz', title: 'سیزده‌بدر', desc: 'روز طبیعت - سیزدهم فروردین' },
            '1-14': { type: 'national', title: 'امروز تعطیل نیست', desc: 'روز ملی فن‌آوری' },
            '2-1': { type: 'national', title: 'روز بزرگداشت عطار', desc: 'خواجه شمس‌الدین محمد عطار نیشابوری' },
            '2-12': { type: 'national', title: 'روز معلم', desc: 'زادروز ابوالحسن خانِ فضل‌علی‌خان - استاد دانشگاه تهران' },
            '2-15': { type: 'national', title: 'جشن نیمه شعبان', desc: 'ولادت با سعادت امام زمان (عج)' },

        // Render Weekdays
        function renderWeekdays() {
            const days = ['ش', 'ی', 'د', 'س', 'چ', 'پ', 'ج'];
            weekdaysEl.innerHTML = days.map((day, i) => 
                `<div class="weekday ${i === 6 ? 'friday' : ''}">${day}</div>`
            ).join('');
        }

        // Convert to Persian numerals
        function toPersianNum(num) {
            const persianDigits = ['۰', '۱', '۲', '۳', '۴', '۵', '۶', '۷', '۸', '۹'];
            return String(num).replace(/\d/g, d => persianDigits[d]);
        }

        // Render Calendar
        function renderCalendar() {
            currentMonthEl.textContent = `${JalaliCalendar.persianMonths[currentMonth - 1]} ${toPersianNum(currentYear)}`;
            
            const daysInMonth = JalaliCalendar.getDaysInMonth(currentYear, currentMonth);
            const firstDayOfWeek = JalaliCalendar.getDayOfWeek(currentYear, currentMonth, 1);
            
            // Adjust for Saturday start
            const startDay = (firstDayOfWeek + 1) % 7;
            
            // Previous month days
            let prevMonth = currentMonth === 1 ? 12 : currentMonth - 1;
            let prevYear = currentMonth === 1 ? currentYear - 1 : currentYear;
            const daysInPrevMonth = JalaliCalendar.getDaysInMonth(prevYear, prevMonth);
            
            let html = '';
            
            // Previous month days
            for (let i = startDay - 1; i >= 0; i--) {
                html += `<div class="day other-month"><span class="day-number">${toPersianNum(daysInPrevMonth - i)}</span></div>`;
            }
            
            // Current month days
            for (let day = 1; day <= daysInMonth; day++) {
                const dateKey = `${currentMonth}-${day}`;
                const event = fixedHolidays[dateKey];
                const isFriday = JalaliCalendar.getDayOfWeek(currentYear, currentMonth, day) === 6;
                const isToday = currentYear === todayYear && currentMonth === todayMonth && day === todayDay;
                
                let classes = ['day'];
                if (isToday) classes.push('today');
                if (isFriday) classes.push('friday');
                if (event) {
                    classes.push(event.type === 'nowruz' ? 'nowruz' : 
                               event.type === 'religious' ? 'religious' : 
                               event.type === 'national' ? 'national' : 'holiday');
                }
                
                html += `
                    <div class="${classes.join(' ')}" data-date="${dateKey}" data-day="${day}">
                        <span class="day-number">${toPersianNum(day)}</span>
                        ${event ? '<div class="holiday-dot"></div>' : ''}
                    </div>
                `;
            }
            
            // Next month days
            const totalCells = startDay + daysInMonth;
            const remainingCells = totalCells % 7 === 0 ? 0 : 7 - (totalCells % 7);
            for (let i = 1; i <= remainingCells; i++) {
                html += `<div class="day other-month"><span class="day-number">${toPersianNum(i)}</span></div>`;
            }
            
            daysGridEl.innerHTML = html;
            
            // Add click handlers
            document.querySelectorAll('.day:not(.other-month)').forEach(dayEl => {
                dayEl.addEventListener('click', () => showDayEvents(dayEl));
            });
        }

        // Show Day Events
        function showDayEvents(dayEl) {
            const dateKey = dayEl.dataset.date;
            const day = parseInt(dayEl.dataset.day);
            const event = fixedHolidays[dateKey];
            const dayOfWeek = JalaliCalendar.persianDays[JalaliCalendar.getDayOfWeek(currentYear, currentMonth, day)];
            
            modalDateEl.textContent = `${toPersianNum(day)} ${JalaliCalendar.persianMonths[currentMonth - 1]} ${toPersianNum(currentYear)}`;
            modalDayEl.textContent = dayOfWeek;
            
            let eventsHtml = '';
            
            if (event) {
                const iconSvg = event.type === 'nowruz' ? 
                    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"></path></svg>' :
                    event.type === 'religious' ?
                    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm0 0v20M12 2a15 15 0 0 1 0 20M2 12h20"></path></svg>' :
                    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>';
                
                eventsHtml += `
                    <li class="event-item">
                        <div class="event-icon ${event.type}">${iconSvg}</div>
                        <div class="event-text">
                            <div class="event-title">${event.title}</div>
                            <div class="event-desc">${event.desc}</div>
                        </div>
                    </li>
                `;
            } else {
                eventsHtml = `
                    <li class="event-item">
                        <div class="event-text">
                            <div class="event-title">روز عادی</div>
                            <div class="event-desc">مناسبت خاصی ثبت نشده</div>
                        </div>
                    </li>
                `;
            }
            
            eventListEl.innerHTML = eventsHtml;
            modalEl.classList.add('active');
        }

        // Event Listeners
        document.getElementById('prevMonth').addEventListener('click', () => {
            currentMonth--;
            if (currentMonth < 1) {
                currentMonth = 12;
                currentYear--;
            }
            renderCalendar();
        });

        document.getElementById('nextMonth').addEventListener('click', () => {
            currentMonth++;
            if (currentMonth > 12) {
                currentMonth = 1;
                currentYear++;
            }
            renderCalendar();
        });

        document.getElementById('todayBtn').addEventListener('click', () => {
            currentYear = todayYear;
            currentMonth = todayMonth;
            renderCalendar();
        });

        document.getElementById('closeModal').addEventListener('click', () => {
            modalEl.classList.remove('active');
        });

        modalEl.addEventListener('click', (e) => {
            if (e.target === modalEl) {
                modalEl.classList.remove('active');
            }
        });

        // Initial render
        renderWeekdays();
        renderCalendar();
    </script>
</body>
</html>
