<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تقویم شمسی | نادر اکشیک</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&family=Lalezar&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0d9488;
            --primary-dark: #0f766e;
            --primary-light: #14b8a6;
            --secondary: #f59e0b;
            --accent: #fbbf24;
            --bg-dark: #0c0a09;
            --bg-card: rgba(28, 25, 23, 0.9);
            --bg-card-solid: #1c1917;
            --text-primary: #fafaf9;
            --text-secondary: #a8a29e;
            --text-muted: #78716c;
            --holiday: #ef4444;
            --friday: #eab308;
            --nowruz: #22c55e;
            --religious: #a855f7;
            --national: #3b82f6;
            --border: rgba(255,255,255,0.08);
            --glow: rgba(20, 184, 166, 0.3);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Vazirmatn', sans-serif;
            background: var(--bg-dark);
            min-height: 100vh;
            color: var(--text-primary);
            overflow-x: hidden;
            position: relative;
        }

        .bg-glow {
            position: fixed;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: 
                radial-gradient(circle at 30% 20%, rgba(13, 148, 136, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 70% 80%, rgba(245, 158, 11, 0.1) 0%, transparent 40%);
            animation: bgFloat 20s ease-in-out infinite;
            z-index: 0;
        }

        @keyframes bgFloat {
            0%, 100% { transform: translate(0, 0); }
            33% { transform: translate(2%, -2%); }
            66% { transform: translate(-2%, 2%); }
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 2rem 1rem;
            position: relative;
            z-index: 1;
        }

        .header {
            text-align: center;
            margin-bottom: 2rem;
            animation: fadeInDown 0.8s ease-out;
        }

        .badges {
            display: flex;
            justify-content: center;
            gap: 0.75rem;
            flex-wrap: wrap;
            margin-bottom: 1.5rem;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.4rem 1rem;
            border-radius: 50px;
            font-size: 0.8rem;
            font-weight: 500;
            backdrop-filter: blur(10px);
            border: 1px solid var(--border);
        }

        .badge.cloudflare {
            background: linear-gradient(135deg, rgba(244, 130, 32, 0.2), rgba(249, 164, 65, 0.1));
            color: #fb923c;
        }

        .badge.designer {
            background: linear-gradient(135deg, rgba(13, 148, 136, 0.2), rgba(20, 184, 166, 0.1));
            color: var(--primary-light);
        }

        .badge svg { width: 14px; height: 14px; }

        .main-title {
            font-family: 'Lalezar', cursive;
            font-size: clamp(2.5rem, 8vw, 4rem);
            background: linear-gradient(135deg, #ffffff 0%, var(--primary-light) 50%, var(--accent) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 1rem;
            font-weight: 300;
        }

        .today-card {
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            text-align: center;
            position: relative;
            overflow: hidden;
            animation: fadeInUp 0.6s ease-out 0.1s both;
        }

        .today-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--primary), var(--secondary), var(--primary));
        }

        .today-label {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 0.25rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .today-date {
            font-family: 'Lalezar', cursive;
            font-size: 2rem;
            color: var(--accent);
        }

        .today-day { color: var(--text-secondary); font-size: 1rem; }

        .today-event {
            margin-top: 1rem;
            padding: 0.75rem;
            background: rgba(255,255,255,0.03);
            border-radius: 12px;
            display: none;
        }

        .today-event.show { display: block; animation: fadeIn 0.3s; }

        .today-event-badge {
            display: inline-block;
            padding: 0.2rem 0.6rem;
            border-radius: 50px;
            font-size: 0.7rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .today-event-badge.nowruz { background: rgba(34, 197, 94, 0.2); color: var(--nowruz); }
        .today-event-badge.religious { background: rgba(168, 85, 247, 0.2); color: var(--religious); }
        .today-event-badge.national { background: rgba(59, 130, 246, 0.2); color: var(--national); }
        .today-event-badge.holiday { background: rgba(239, 68, 68, 0.2); color: var(--holiday); }

        .today-event-title { font-weight: 700; font-size: 1rem; }
        .today-event-desc { color: var(--text-muted); font-size: 0.85rem; margin-top: 0.25rem; }

        .nav-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            flex-wrap: wrap;
            gap: 0.75rem;
            animation: fadeInUp 0.6s ease-out 0.2s both;
        }

        .month-nav { display: flex; align-items: center; gap: 0.5rem; }

        .nav-btn {
            background: var(--bg-card-solid);
            border: 1px solid var(--border);
            color: var(--text-primary);
            width: 40px;
            height: 40px;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }

        .nav-btn:hover {
            background: var(--primary);
            border-color: var(--primary);
            transform: translateY(-2px);
            box-shadow: 0 4px 20px var(--glow);
        }

        .nav-btn svg { width: 18px; height: 18px; }

        .current-month {
            font-family: 'Lalezar', cursive;
            font-size: 1.4rem;
            min-width: 160px;
            text-align: center;
        }

        .today-btn {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            border: none;
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 10px;
            font-family: 'Vazirmatn', sans-serif;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.3s;
        }

        .today-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px var(--glow);
        }

        .calendar-wrapper {
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 1.25rem;
            border: 1px solid var(--border);
            animation: fadeInUp 0.8s ease-out 0.4s both;
        }

        .weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 0.25rem;
            margin-bottom: 0.5rem;
        }

        .weekday {
            text-align: center;
            padding: 0.5rem;
            font-weight: 600;
            font-size: 0.85rem;
        }

        .weekday:not(.friday) { color: var(--text-secondary); }
        .weekday.friday { color: var(--friday); }

        .days-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 0.25rem;
        }

        .day {
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            background: transparent;
            border: 1px solid transparent;
        }

        .day:hover:not(.other-month) {
            background: rgba(255,255,255,0.05);
            transform: scale(1.05);
        }

        .day-number { font-size: 1rem; font-weight: 500; }

        .day.other-month { opacity: 0.25; }
        .day.other-month .day-number { color: var(--text-muted); }

        .day.today {
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            border-color: var(--primary-light);
            box-shadow: 0 4px 20px var(--glow);
        }

        .day.today .day-number { font-weight: 800; color: white; }

        .day.friday { background: rgba(234, 179, 8, 0.08); }
        .day.friday .day-number { color: var(--friday); font-weight: 700; }

        .day.holiday {
            background: rgba(239, 68, 68, 0.1);
            border-color: rgba(239, 68, 68, 0.3);
        }
        .day.holiday .day-number { color: var(--holiday); font-weight: 700; }

        .day.nowruz {
            background: rgba(34, 197, 94, 0.1);
            border-color: rgba(34, 197, 94, 0.3);
        }
        .day.nowruz .day-number { color: var(--nowruz); font-weight: 700; }

        .day.religious {
            background: rgba(168, 85, 247, 0.1);
            border-color: rgba(168, 85, 247, 0.3);
        }
        .day.religious .day-number { color: var(--religious); font-weight: 700; }

        .day.national {
            background: rgba(59, 130, 246, 0.1);
            border-color: rgba(59, 130, 246, 0.3);
        }
        .day.national .day-number { color: var(--national); font-weight: 700; }

        .holiday-indicator {
            position: absolute;
            bottom: 3px;
            display: flex;
            gap: 2px;
        }

        .indicator-dot {
            width: 4px;
            height: 4px;
            border-radius: 50%;
        }

        .day.holiday .indicator-dot { background: var(--holiday); }
        .day.nowruz .indicator-dot { background: var(--nowruz); }
        .day.religious .indicator-dot { background: var(--religious); }
        .day.national .indicator-dot { background: var(--national); }
        .day.friday .indicator-dot { background: var(--friday); }

        .event-modal {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(15px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.3s;
            padding: 1rem;
        }

        .event-modal.active { display: flex; opacity: 1; }

        .modal-content {
            background: var(--bg-card-solid);
            border-radius: 20px;
            padding: 1.5rem;
            max-width: 380px;
            width: 100%;
            transform: scale(0.9) translateY(20px);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid var(--border);
        }

        .event-modal.active .modal-content { transform: scale(1) translateY(0); }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 1rem;
        }

        .modal-date { font-family: 'Lalezar', cursive; font-size: 1.4rem; color: var(--accent); }
        .modal-day { color: var(--text-muted); font-size: 0.85rem; }

        .close-btn {
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border);
            color: var(--text-primary);
            width: 32px;
            height: 32px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }

        .close-btn:hover { background: var(--holiday); border-color: var(--holiday); }

        .event-list { list-style: none; }

        .event-item {
            padding: 0.75rem;
            background: rgba(255,255,255,0.03);
            border-radius: 12px;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            border: 1px solid var(--border);
            transition: all 0.2s;
        }

        .event-item:hover {
            background: rgba(255,255,255,0.06);
            transform: translateX(-4px);
        }

        .event-icon {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .event-icon.holiday { background: linear-gradient(135deg, var(--holiday), #f87171); }
        .event-icon.nowruz { background: linear-gradient(135deg, var(--nowruz), #4ade80); }
        .event-icon.religious { background: linear-gradient(135deg, var(--religious), #c084fc); }
        .event-icon.national { background: linear-gradient(135deg, var(--national), #60a5fa); }

        .event-icon svg { width: 20px; height: 20px; color: white; }
        .event-text { flex: 1; }
        .event-title { font-weight: 700; font-size: 0.95rem; }
        .event-desc { font-size: 0.8rem; color: var(--text-muted); }

        .legend {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            justify-content: center;
            margin-top: 1.5rem;
            padding: 1rem;
            background: var(--bg-card);
            backdrop-filter: blur(10px);
            border-radius: 14px;
            border: 1px solid var(--border);
            animation: fadeInUp 0.8s ease-out 0.6s both;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .legend-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        .legend-dot.holiday { background: var(--holiday); }
        .legend-dot.friday { background: var(--friday); }
        .legend-dot.nowruz { background: var(--nowruz); }
        .legend-dot.religious { background: var(--religious); }
        .legend-dot.national { background: var(--national); }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @media (max-width: 640px) {
            .container { padding: 1rem 0.75rem; }
            .calendar-wrapper { padding: 1rem; }
            .day { border-radius: 10px; }
            .day-number { font-size: 0.9rem; }
            .current-month { font-size: 1.2rem; min-width: 130px; }
            .nav-btn { width: 36px; height: 36px; }
            .today-date { font-size: 1.75rem; }
            .legend { gap: 0.75rem; padding: 0.75rem; }
            .main-title { font-size: 2rem; }
        }
    </style>
</head>
<body>
    <div class="bg-glow"></div>
    
    <div class="container">
        <header class="header">
            <div class="badges">
                <div class="badge cloudflare">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
                    Cloudflare Worker
                </div>
                <div class="badge designer">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
                    نادر اکشیک
                </div>
            </div>
            <h1 class="main-title">تقویم شمسی</h1>
            <p class="subtitle">تقویم رسمی ایران با تمام مناسبت‌ها</p>
        </header>

        <div class="today-card" id="todayCard">
            <div class="today-label">امروز</div>
            <div class="today-date" id="todayDate"></div>
            <div class="today-day" id="todayDay"></div>
            <div class="today-event" id="todayEvent">
                <span class="today-event-badge" id="todayEventBadge"></span>
                <div class="today-event-title" id="todayEventTitle"></div>
                <div class="today-event-desc" id="todayEventDesc"></div>
            </div>
        </div>

        <nav class="nav-section">
            <div class="month-nav">
                <button class="nav-btn" id="prevMonth">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"></polyline></svg>
                </button>
                <span class="current-month" id="currentMonth"></span>
                <button class="nav-btn" id="nextMonth">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"></polyline></svg>
                </button>
            </div>
            <button class="today-btn" id="todayBtn">امروز</button>
        </nav>

        <div class="calendar-wrapper">
            <div class="weekdays" id="weekdays"></div>
            <div class="days-grid" id="daysGrid"></div>
        </div>

        <div class="legend">
            <div class="legend-item"><div class="legend-dot holiday"></div>تعطیل</div>
            <div class="legend-item"><div class="legend-dot friday"></div>جمعه</div>
            <div class="legend-item"><div class="legend-dot nowruz"></div>نوروز</div>
            <div class="legend-item"><div class="legend-dot religious"></div>مذهبی</div>
            <div class="legend-item"><div class="legend-dot national"></div>ملی</div>
        </div>
    </div>

    <div class="event-modal" id="eventModal">
        <div class="modal-content">
            <div class="modal-header">
                <div>
                    <div class="modal-date" id="modalDate"></div>
                    <div class="modal-day" id="modalDay"></div>
                </div>
                <button class="close-btn" id="closeModal">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
            </div>
            <ul class="event-list" id="eventList"></ul>
        </div>
    </div>

    <script>
        const persianMonths = ['فروردین', 'اردیبهشت', 'خرداد', 'تیر', 'مرداد', 'شهریور', 'مهر', 'آبان', 'آذر', 'دی', 'بهمن', 'اسفند'];
        const persianDays = ['یکشنبه', 'دوشنبه', 'سه‌شنبه', 'چهارشنبه', 'پنج‌شنبه', 'جمعه', 'شنبه'];
        const weekDaysShort = ['ش', 'ی', 'د', 'س', 'چ', 'پ', 'ج'];

        class JalaliCalendar {
            static toJalali(gy, gm, gd) {
                const g_d_m = [0, 31, 59, 90, 120, 151, 181, 212, 243, 273, 304, 334];
                let jy = (gy <= 1600) ? 0 : 979;
                gy -= (gy <= 1600) ? 621 : 1600;
                const gy2 = (gm > 2) ? (gy + 1) : gy;
                let days = (365 * gy) + Math.floor((gy2 + 3) / 4) - Math.floor((gy2 + 99) / 100) + Math.floor((gy2 + 399) / 400) - 80 + gd + g_d_m[gm - 1];
                jy += 33 * Math.floor(days / 12053);
                days %= 12053;
                jy += 4 * Math.floor(days / 1461);
                days %= 1461;
                jy += Math.floor((days - 1) / 365);
                if (days > 365) days = (days - 1) % 365;
                const jm = (days < 186) ? 1 + Math.floor(days / 31) : 7 + Math.floor((days - 186) / 30);
                const jd = 1 + ((days < 186) ? (days % 31) : ((days - 186) % 30));
                return [jy, jm, jd];
            }

            static toGregorian(jy, jm, jd) {
                let jy_new = jy + 1595;
                const days = -1 + 365 * jy_new + Math.floor(jy_new / 33) * 8 + Math.floor((jy_new % 33 + 3) / 4) + jd + ((jm < 7) ? (jm - 1) * 31 : ((jm - 7) * 30) + 186);
                let gy = 400 * Math.floor(days / 146097);
                let d = days - 146097 * Math.floor(gy / 400);
                gy += 100 * Math.floor(d / 36524);
                d -= 36524 * Math.floor(gy / 100);
                gy += 4 * Math.floor(d / 1461);
                d -= 1461 * Math.floor(d / 1461);
                gy += Math.floor((d - 1) / 365);
                if (d > 365) d = (d - 1) % 365;
                const gd = d + 1;
                const sal_a = [0, 31, (gy % 4 === 0 && gy % 100 !== 0) || (gy % 400 === 0) ? 29 : 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
                let gm = 0;
                let v = gd;
                for (gm = 0; gm < 13 && v > sal_a[gm]; gm++) v -= sal_a[gm];
                return [gy, gm, gd];
            }

            static getDaysInMonth(jy, jm) {
                if (jm <= 6) return 31;
                if (jm <= 11) return 30;
                return this.isLeapYear(jy) ? 30 : 29;
            }

            static isLeapYear(jy) {
                return ((11 * jy + 14) % 30) < 11;
            }

            static getDayOfWeek(jy, jm, jd) {
                const [gy, gm, gd] = this.toGregorian(jy, jm, jd);
                return new Date(gy, gm - 1, gd).getDay();
            }
        }

        // Official Iranian Holidays - تقویم رسمی ایران ۱۴۰۴
        const holidays = {
            // فروردین - نوروز
            '1-1': { type: 'nowruz', title: 'نوروز', desc: 'آغاز سال نو شمسی' },
            '1-2': { type: 'nowruz', title: 'عید نوروز', desc: 'دوم فروردین' },
            '1-3': { type: 'nowruz', title: 'سوم نوروز', desc: 'سوم فروردین' },
            '1-4': { type: 'nowruz', title: 'چهارم نوروز', desc: 'چهارم فروردین' },

        let currentYear, currentMonth;

        const [todayYear, todayMonth, todayDay] = JalaliCalendar.toJalali(today.getFullYear(), today.getMonth() + 1, today.getDate());
        currentYear = todayYear;
        currentMonth = todayMonth;

        const weekdaysEl = document.getElementById('weekdays');
        const daysGridEl = document.getElementById('daysGrid');
        const currentMonthEl = document.getElementById('currentMonth');
        const modalEl = document.getElementById('eventModal');
        const eventListEl = document.getElementById('eventList');
        const modalDateEl = document.getElementById('modalDate');
        const modalDayEl = document.getElementById('modalDay');

        function toPersianNum(num) {
            const persianDigits = ['۰', '۱', '۲', '۳', '۴', '۵', '۶', '۷', '۸', '۹'];
            return String(num).replace(/\d/g, d => persianDigits[d]);
        }

        function renderWeekdays() {
            weekdaysEl.innerHTML = weekDaysShort.map((day, i) => 
                `<div class="weekday ${i === 6 ? 'friday' : ''}">${day}</div>`
            ).join('');
        }

        function renderTodayCard() {
            const dayOfWeek = JalaliCalendar.getDayOfWeek(todayYear, todayMonth, todayDay);
            document.getElementById('todayDate').textContent = `${toPersianNum(todayDay)} ${persianMonths[todayMonth - 1]} ${toPersianNum(todayYear)}`;
            document.getElementById('todayDay').textContent = persianDays[dayOfWeek];
            
            const dateKey = `${todayMonth}-${todayDay}`;
            const event = holidays[dateKey];
            const todayEvent = document.getElementById('todayEvent');
            
            if (event) {
                todayEvent.classList.add('show');
                document.getElementById('todayEventBadge').textContent = event.title;
                document.getElementById('todayEventBadge').className = `today-event-badge ${event.type}`;
                document.getElementById('todayEventTitle').textContent = event.title;
                document.getElementById('todayEventDesc').textContent = event.desc;
            } else {
                todayEvent.classList.remove('show');
            }
        }

        function renderCalendar() {
            currentMonthEl.textContent = `${persianMonths[currentMonth - 1]} ${toPersianNum(currentYear)}`;
            
            const daysInMonth = JalaliCalendar.getDaysInMonth(currentYear, currentMonth);
            const firstDayOfWeek = JalaliCalendar.getDayOfWeek(currentYear, currentMonth, 1);
            const startDay = (firstDayOfWeek + 1) % 7;
            
            let prevMonth = currentMonth === 1 ? 12 : currentMonth - 1;
            let prevYear = currentMonth === 1 ? currentYear - 1 : currentYear;
            const daysInPrevMonth = JalaliCalendar.getDaysInMonth(prevYear, prevMonth);
            
            let html = '';
            
            for (let i = startDay - 1; i >= 0; i--) {
                html += `<div class="day other-month"><span class="day-number">${toPersianNum(daysInPrevMonth - i)}</span></div>`;
            }
            
            for (let day = 1; day <= daysInMonth; day++) {
                const dateKey = `${currentMonth}-${day}`;
                const event = holidays[dateKey];
                const isFriday = JalaliCalendar.getDayOfWeek(currentYear, currentMonth, day) === 6;
                const isToday = currentYear === todayYear && currentMonth === todayMonth && day === todayDay;
                
                let classes = ['day'];
                if (isToday) classes.push('today');
                if (isFriday) classes.push('friday');
                if (event) {
                    classes.push(event.type === 'nowruz' ? 'nowruz' : event.type === 'religious' ? 'religious' : event.type === 'national' ? 'national' : 'holiday');
                }
                
                html += `
                    <div class="${classes.join(' ')}" data-date="${dateKey}" data-day="${day}">
                        <span class="day-number">${toPersianNum(day)}</span>
                        ${(event || isFriday) ? '<div class="holiday-indicator"><div class="indicator-dot"></div></div>' : ''}
                    </div>
                `;
            }
            
            const totalCells = startDay + daysInMonth;
            const remainingCells = totalCells % 7 === 0 ? 0 : 7 - (totalCells % 7);
            for (let i = 1; i <= remainingCells; i++) {
                html += `<div class="day other-month"><span class="day-number">${toPersianNum(i)}</span></div>`;
            }
            
            daysGridEl.innerHTML = html;
            
            document.querySelectorAll('.day:not(.other-month)').forEach(dayEl => {
                dayEl.addEventListener('click', () => showDayEvents(dayEl));
            });
        }

        function showDayEvents(dayEl) {
            const dateKey = dayEl.dataset.date;
            const day = parseInt(dayEl.dataset.day);
            const dayOfWeek = JalaliCalendar.getDayOfWeek(currentYear, currentMonth, day);
            
            modalDateEl.textContent = `${toPersianNum(day)} ${persianMonths[currentMonth - 1]} ${toPersianNum(currentYear)}`;
            modalDayEl.textContent = persianDays[dayOfWeek];
            
            const event = holidays[dateKey];
            const isFriday = dayOfWeek === 6;
            
            let html = '';
            
            if (event) {
                const iconSvg = event.type === 'nowruz' ? 
                    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"></path></svg>' :
                    event.type === 'religious' ?
                    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><path d="M12 6v6l4 2"></path></svg>' :
                    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>';
                
                html += `
                    <li class="event-item">
                        <div class="event-icon ${event.type}">${iconSvg}</div>
                        <div class="event-text">
                            <div class="event-title">${event.title}</div>
                            <div class="event-desc">${event.desc}</div>
                        </div>
                    </li>
                `;
            }
            
            if (isFriday && !event) {
                html += `
                    <li class="event-item">
                        <div class="event-icon national">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
                        </div>
                        <div class="event-text">
                            <div class="event-title">روز جمعه</div>
                            <div class="event-desc">جمعه‌بازار</div>
                        </div>
                    </li>
                `;
            }
            
            if (!event && !isFriday) {
                html += `
                    <li class="event-item">
                        <div class="event-text">
                            <div class="event-title">روز عادی</div>
                            <div class="event-desc">مناسبت خاصی ثبت نشده</div>
                        </div>
                    </li>
                `;
            }
            
            eventListEl.innerHTML = html;
            modalEl.classList.add('active');
        }

        document.getElementById('prevMonth').addEventListener('click', () => {
            currentMonth--;
            if (currentMonth < 1) { currentMonth = 12; currentYear--; }
            renderCalendar();
        });

        document.getElementById('nextMonth').addEventListener('click', () => {
            currentMonth++;
            if (currentMonth > 12) { currentMonth = 1; currentYear++; }
            renderCalendar();
        });

            currentYear = todayYear;
            currentMonth = todayMonth;
            renderCalendar();
        });

            modalEl.classList.remove('active');
        });

        modalEl.addEventListener('click', (e) => {
            if (e.target === modalEl) modalEl.classList.remove('active');
        });

        renderWeekdays();
        renderTodayCard();
        renderCalendar();
    </script>
